name: quanly_thuvien
description: MỌT - Ứng dụng quản lý thư viện cho độc giả, thủ thư và quản lý.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: MotSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    - family: MotSerif
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
        - asset: assets/fonts/DejaVuSerif-Bold.ttf
          weight: 700
